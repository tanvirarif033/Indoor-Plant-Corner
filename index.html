<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Indoor Plant Corner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: Segoe UI, Arial, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #panel {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: rgba(20, 24, 22, 0.7); color: #eee;
      padding: 12px 16px; border-radius: 10px; width: 210px;
      backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none; /* clicks pass through to the canvas underneath */
    }
    #panel h1 { font-size: 14px; letter-spacing: 1px; margin-bottom: 8px; color: #8fd694; }
    #panel p { font-size: 12px; line-height: 1.5; color: #ddd; margin-bottom: 6px; }
    #panel kbd {
      background: #333; padding: 1px 6px; border-radius: 4px; border: 1px solid #555;
    }
    #mode, #colorLabel {
      margin-top: 4px; font-weight: bold; font-size: 12px;
      padding: 3px 8px; border-radius: 6px; display: inline-block; margin-right: 4px;
    }
    #mode.day { background: #ffe08a; color: #3a2e00; }
    #mode.night { background: #2a3a6b; color: #cfe0ff; }
    #colorLabel { background: #3f8f3f; color: #fff; }
    /* shown only if WebGL/module loading fails, so the page never looks silently blank */
    #fatalError {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: #1a1a1a; color: #f5a3a3; font-family: monospace;
      padding: 24px; white-space: pre-wrap; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="panel">
    <h1>INDOOR PLANT CORNER</h1>
    <p><kbd>D</kbd> Day &nbsp; <kbd>N</kbd> Night &nbsp; <kbd>Space</kbd> Toggle</p>
    <p>Click the plant to change its color.</p>
    <span id="mode" class="day">DAY</span>
    <span id="colorLabel">GREEN</span>
  </div>
  <div id="fatalError"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
